[workspace]
resolver = "2"
members = [
    "crates/cargotom",
    "crates/info-provider",
    "crates/lsp",
    "crates/parser",
    "crates/rust-version",
]
exclude = ["zed-cargotom"]
default-members = ["crates/cargotom"]

    [workspace.package]
    version = "2.3.14"
    edition = "2021"

    [workspace.dependencies]
    anyhow = "1.0"
    async-recursion = { version = "1" }
    byteorder = "1.5.0"
    crate_info = { path = "./crates/crate_info" }
    fst = "0.4.7"
    glob = "0.3"
    html2md = "0.2.17"
    indexmap = "2.14"
    info-provider = { path = "./crates/info-provider" }
    lsp = { path = "./crates/lsp" }
    openssl = "0.10.82"
    parser = { path = "./crates/parser" }
    proctitle = "0.1.1"
    regex = "1.13"
    reqwest = "0.13"
    ropey = "1.6.1"
    rust-version = { path = "./crates/rust-version" }
    serde = "1.0"
    serde_json = "1.0"
    taplo = { git = "https://github.com/frederik-uni/taplo" }
    tcp-struct = { git = "https://github.com/frederik-uni/tcp-struct" }
    tokio = "1.54"
    toml = "1.2"
    tower-lsp = "0.20.0"
    trie-rs = "0.4.2"
    url = "2.5"
    urlencoding = "2.1.3"
    webbrowser = "1.2"

    [workspace.lints.clippy]
    cargo = { level = "warn", priority = -1 }
    complexity = { level = "warn", priority = -1 }
    correctness = { level = "warn", priority = -1 }
    expect_used = { level = "deny", priority = 1 }
    perf = { level = "warn", priority = -1 }
    style = { level = "warn", priority = -1 }
    suspicious = { level = "warn", priority = -1 }
    todo = "warn"
    unimplemented = "warn"
    unwrap_used = { level = "deny", priority = 1 }

    [workspace.lints.rust]
    deprecated-safe = "warn"
    future-incompatible = "warn"
    keyword-idents = "warn"
    let-underscore = "warn"
    nonstandard-style = "warn"
    refining-impl-trait = "warn"
    rust-2024-compatibility = "warn"
    unused = "warn"
    warnings = "warn"

[patch.crates-io]
html2md = { git = "https://gitlab.com/o0Frederik0o/html2md.git" }
