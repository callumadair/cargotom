[workspace]
resolver = "2"
members = [
    "crates/cargotom",
    "crates/info-provider",
    "crates/lsp",
    "crates/parser",
]
exclude = ["zed-cargotom"]
default-members = ["crates/cargotom"]

    [workspace.package]
    version = "2.3.14"
    edition = "2024"
    license = "MIT"
    repository = "https://github.com/callumadair/cargotom"
    keywords = ["cargo", "lsp", "toml", "language-server", "manifest"]
    categories = ["development-tools", "text-editors"]

    [workspace.dependencies]
    cargo = "0.101"
    cargo-platform = "0.3"
    cargo-util = "0.2"
    cargo-util-schemas = "0.15"
    html2md = "0.2.17"
    indexmap = "2.14"
    info-provider = { path = "./crates/info-provider" }
    lsp = { path = "./crates/lsp" }
    parser = { path = "./crates/parser" }
    regex = "1.13"
    ropey = "1.6.1"
    semver = "1.0"
    snafu = "0.9"
    serde = "1.0"
    serde_json = "1.0"
    taplo = { git = "https://github.com/frederik-uni/taplo" }
    tokio = "1.54"
    toml = "1.2"
    toml_edit = "0.25"
    tower-lsp = "0.20.0"
    url = "2.5"
    webbrowser = "1.2"

    [workspace.lints.clippy]
    cargo = { level = "warn", priority = -1 }
    complexity = { level = "warn", priority = -1 }
    correctness = { level = "warn", priority = -1 }
    expect_used = { level = "deny", priority = 1 }
    perf = { level = "warn", priority = -1 }
    style = { level = "warn", priority = -1 }
    suspicious = { level = "warn", priority = -1 }
    todo = "warn"
    unimplemented = "warn"
    unwrap_used = { level = "deny", priority = 1 }

    [workspace.lints.rust]
    deprecated_safe = "warn"
    future_incompatible = "warn"
    keyword_idents = "warn"
    let_underscore = "warn"
    nonstandard_style = "warn"
    refining_impl_trait = "warn"
    rust_2024_compatibility = "warn"
    unused = "warn"
    warnings = "warn"
